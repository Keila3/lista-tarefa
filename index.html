<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de tarefas</title>
  </head>
  <body>
    <!-- Criando um gerenciador de tarefas simples usando HTML, CSS e JavaScript -->
    <h1>Adicione uma nova tarefa:</h1>
    <!-- O input para digitar a tarefa, o botão para adicionar e a lista para exibir as tarefas -->
    <input id="tarefa" placeholder="Escreva aqui sua tarefa..." />
    <button id="btn">ADICIONAR</button>
    <ul id="lista"></ul>
    <script src="script.js"></script>
  </body>
</html>
